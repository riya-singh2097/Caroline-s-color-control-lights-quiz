<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Qbit Colour Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one centred card that swaps between start, question and finish screens; candy-coloured answer buttons, full-screen reactions. */
:root{
  --sky:#bfe8ff;
  --sky2:#e9f8ff;
  --ink:#1c2660;
  --card:#ffffff;
  --sun:#ffc21a;
  --sun-d:#e09a00;
  --pink:#ff5fa2;
  --mint:#31d38a;
  --violet:#7b5cff;
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%) fixed;
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:600;
  padding-block:12px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--violet);outline-offset:3px}

#floaters{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floater{position:absolute;width:44px;height:44px;border-radius:10px;opacity:.55;animation:drift linear infinite}
.floater::after{content:"";position:absolute;inset:14px;background:rgba(28,38,96,.55);border-radius:3px}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}

.app{position:relative;z-index:1;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}

/* top bar */
.bar{display:flex;align-items:center;gap:12px}
.track{flex:1;min-width:0;height:22px;background:#fff;border-radius:99px;border:3px solid var(--ink);position:relative;overflow:hidden}
.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--sun) 0 18px,#ffd75a 18px 36px);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.count{font-family:var(--font-display);font-weight:600;font-size:1rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.hearts{display:flex;gap:4px}
.hearts svg{width:30px;height:30px;transition:transform .3s}
.heart-full{fill:var(--pink);stroke:var(--ink);stroke-width:1.6}
.heart-off{fill:#fff;stroke:#b9c0e0;stroke-width:1.6}
.icon-btn{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);flex:none}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* card */
.card{background:var(--card);border:4px solid var(--ink);border-radius:32px;box-shadow:0 8px 0 var(--ink);padding:20px 18px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qrow{display:flex;gap:12px;align-items:flex-start}
.qrow h2{flex:1;min-width:0;font-size:clamp(1.55rem,5.4vw,2.3rem);line-height:1.15;font-weight:600}
.stage{display:grid;place-items:center;min-height:150px;position:relative}
.stage img{max-height:210px;width:auto;max-width:100%;border-radius:20px}
.stage img.blk{max-height:200px;width:auto;border:4px solid var(--ink);background:#fff}
.rgbword{display:flex;gap:10px;font-family:var(--font-display);font-weight:700;font-size:clamp(4rem,18vw,7rem);line-height:1}
.rgbword span{display:inline-block;animation:bob 1.6s ease-in-out infinite;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.rgbword span:nth-child(2){animation-delay:.2s}.rgbword span:nth-child(3){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-12px) rotate(-4deg)}}

/* answer buttons */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{
  --c:#ffe27a;--cd:#e0b520;
  min-height:84px;min-width:0;border:3px solid var(--ink);border-radius:22px;background:var(--c);
  box-shadow:0 6px 0 var(--ink);padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--font-display);font-weight:600;font-size:clamp(1.1rem,4.4vw,1.5rem);line-height:1.15;text-align:center;
  transition:transform .12s,box-shadow .12s,opacity .2s;overflow-wrap:anywhere;
}
.opt:nth-child(1){--c:#ffe27a}.opt:nth-child(2){--c:#ffb3d1}.opt:nth-child(3){--c:#a8f0c8}.opt:nth-child(4){--c:#cdbfff}
.opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.opt.visual{min-height:120px;padding:8px}
.opt.visual img.blk{max-height:104px;width:auto;border-radius:12px}
.opt.visual img{max-height:96px;max-width:100%;border-radius:12px;background:#fff}
.opt.gone{opacity:.35;box-shadow:0 0 0 var(--ink);transform:translateY(6px);cursor:not-allowed}
.opt.shake{animation:shake .5s}
.opt.right{background:#5ce08f;animation:pop .6s}
.opt.reveal{background:#5ce08f;animation:pop .8s}
.opt:disabled{cursor:default}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes pop{40%{transform:scale(1.08) rotate(-2deg)}70%{transform:scale(.97) rotate(1deg)}}
.dot{display:inline-block;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);flex:none}
.dots{display:flex;gap:6px}
.swatch{width:44px;height:44px}

/* mix stage */
.mix{width:100%;max-width:420px;height:210px;background:#0d1235;border:4px solid var(--ink);border-radius:26px;position:relative;isolation:isolate;overflow:hidden}
.lamp{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;mix-blend-mode:screen;transition:transform .9s cubic-bezier(.5,1.3,.5,1);box-shadow:0 0 28px 6px currentColor}
.plus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:700;font-size:2.2rem;color:#fff;transition:opacity .3s;z-index:2}
.mix.merged .plus{opacity:0}
.mix .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#aeb7ef;font-size:.95rem;font-family:var(--font-display)}
.mix.merged .hint{opacity:0}

/* feedback */
.fb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#effff6;border:3px dashed var(--mint);border-radius:22px;padding:12px 14px}
.fb p{margin:0;flex:1 1 220px;min-width:0;font-size:1.1rem;line-height:1.35}
.fb b{font-family:var(--font-display);font-size:1.35rem;display:block}
.go{border:3px solid var(--ink);background:var(--violet);color:#fff;border-radius:99px;box-shadow:0 5px 0 var(--ink);padding:12px 26px;font-family:var(--font-display);font-size:1.35rem;font-weight:600;flex:none}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.go.big{font-size:1.9rem;padding:16px 44px;background:var(--pink)}

/* start + end screens */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:8px}
.hero h1{font-size:clamp(2.6rem,11vw,4.4rem);line-height:1;font-weight:700}
.hero h1 .r{color:#ff2d55}.hero h1 .g{color:#17b95a}.hero h1 .b{color:#3a4dff}
.hero p{margin:0;font-size:1.2rem;max-width:30ch;line-height:1.4}
.rules{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rule{background:#fff6cf;border:3px solid var(--ink);border-radius:99px;padding:6px 14px;font-family:var(--font-display);font-weight:500;font-size:1rem;display:flex;align-items:center;gap:6px}
.rule svg{width:22px;height:22px}
.photo{width:min(300px,80%);border-radius:22px;border:4px solid var(--ink)}
.stars{display:flex;gap:8px;justify-content:center}
.stars svg{width:68px;height:68px;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.star-on{fill:var(--sun);animation:starpop .6s both}
.star-off{fill:#e4e8f7}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.score{font-family:var(--font-display);font-size:1.5rem;font-weight:600}

.robot{width:150px;height:150px;overflow:visible}
.robot.small{width:96px;height:96px}
.ant{animation:antcol 2.4s steps(1) infinite}
@keyframes antcol{0%{fill:#ff2d55}33%{fill:#1fd45e}66%{fill:#3a4dff}}
.wave{animation:wave 1.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes wave{50%{transform:rotate(4deg) translateY(-6px)}}

/* full-screen reactions */
.ov{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow:hidden}
.ov h2{font-size:clamp(2.4rem,10vw,4.6rem);line-height:1.05;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;font-weight:700;text-shadow:0 5px 0 var(--ink)}
.ov p{margin:0;color:#fff;font-size:1.35rem;max-width:28ch}
.ov .robot{width:min(46vw,230px);height:auto}
.ov.oops{background:radial-gradient(circle at 50% 40%,#ffb020,#ff5a3c 70%);animation:flash .5s}
.ov.oops .robot{animation:wobble .6s ease-in-out infinite}
.ov.oops .qm{position:absolute;font-family:var(--font-display);font-weight:700;color:#fff;opacity:.35;animation:qm 3s ease-in-out infinite}
.ov.sad{background:linear-gradient(180deg,#3a4a8c,#1c2660)}
.ov.sad .robot{animation:sob 1.2s ease-in-out infinite}
.ov.sad .ans{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:10px 20px;font-family:var(--font-display);font-weight:600;font-size:1.5rem;box-shadow:0 6px 0 #0b1138;max-width:90%}
.drop{position:absolute;top:-30px;width:4px;height:26px;border-radius:4px;background:#8fd4ff;opacity:.8;animation:rain linear infinite}
@keyframes rain{to{transform:translateY(115vh)}}
@keyframes flash{from{filter:brightness(2)}to{filter:none}}
@keyframes wobble{25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(1.05)}}
@keyframes sob{50%{transform:translateY(8px) scale(.97)}}
@keyframes qm{50%{transform:translateY(-30px) rotate(14deg)}}
.ov > *{position:relative;z-index:1}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}

@media (max-width:420px){
  .card{padding:16px 12px 18px;border-radius:26px}
  .opts{gap:10px}
  .opt{min-height:78px}
  .stars svg{width:54px;height:54px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .floater{display:none}
}
</style>

<div id="floaters" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="app">
  <!-- START -->
  <section id="start" class="card hero">
    <div id="startRobot"></div>
    <h1>Qbit <span class="r">Co</span><span class="g">lo</span><span class="b">ur</span> Quiz</h1>
    <p>Help Caroline build her colour lights! Can you name the robot parts?</p>
    <div class="rules">
      <span class="rule"><svg viewBox="0 0 24 24" class="heart-full"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>2 tries each</span>
      <span class="rule"><svg viewBox="0 0 24 24" class="star-on" style="stroke:var(--ink);stroke-width:1.6;animation:none"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.9L12 17.8 5.8 21.1 7 14.2 2 9.3l6.9-1z"/></svg>Win stars</span>
    </div>
    <button class="go big" id="startBtn" type="button">Let's play!</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" hidden>
    <div class="bar" style="margin-bottom:14px">
      <div class="track" role="progressbar" aria-label="Quiz progress" id="track"><div class="fill" id="fill"></div></div>
      <span class="count" id="count"></span>
      <div class="hearts" id="hearts" aria-label="Tries left"></div>
      <button class="icon-btn" id="mute" type="button" aria-label="Sound on or off"></button>
    </div>
    <div class="card">
      <div class="qrow">
        <h2 id="qtext"></h2>
        <button class="icon-btn" id="speak" type="button" aria-label="Read the question aloud">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
        </button>
      </div>
      <div class="stage" id="stage"></div>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb" hidden>
        <p id="fbText"></p>
        <button class="go" id="nextBtn" type="button">Next</button>
      </div>
    </div>
  </section>

  <!-- END -->
  <section id="end" class="card hero" hidden>
    <div id="endRobot"></div>
    <h1 id="endTitle">Hooray!</h1>
    <div class="stars" id="endStars"></div>
    <div class="score" id="endScore"></div>

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function others(pool,key,n){return shuffle(pool.filter(function(k){return k!==key})).slice(0,n)}

function identify(key){
  var pool = PHOTO_KEYS.indexOf(key)>-1 ? PHOTO_KEYS : BLOCK_KEYS;
  var opts = shuffle([key].concat(others(pool,key,3))).map(function(k){return {id:k,kind:'text',label:NAMES[k]}});
  return {say:'What is this?', text:'What is this?', visual:PHOTO_KEYS.indexOf(key)>-1?{kind:'img',key:key}:{kind:'svg',key:key}, options:opts, answer:key, fact:FACTS[key], good:'It is the '+NAMES[key]+'!'};
}
function pickBlock(key){
  var opts = shuffle([key].concat(others(BLOCK_KEYS,key,3))).map(function(k){return {id:k,kind:'svg',key:k,label:NAMES[k]}});
  return {say:'Tap the '+NAMES[key], text:'Tap the '+NAMES[key]+'.', visual:null, options:opts, answer:key, fact:FACTS[key], good:'That is the '+NAMES[key]+'!'};
}
function pickBrain(){
  var opts = shuffle(PHOTO_KEYS).map(function(k){return {id:k,kind:'img',key:k,label:NAMES[k]}});
  return {say:'Tap the brain of the robot.', text:'Tap the brain of the robot.', visual:null, options:opts, answer:'qbrick', fact:FACTS.qbrick, good:'The QBrick!'};
}
function mix(parts,res){
  var names = parts.map(function(p){return COLORS[p].n});
  var pool = shuffle(Object.keys(RESULTS).filter(function(k){return k!==res})).slice(0,3);
  var opts = shuffle([res].concat(pool)).map(function(k){return {id:k,kind:'swatch',label:RESULTS[k].n,hex:RESULTS[k].hex}});
  var sentence = names.join(' + ');
  return {say:'Mix '+names.join(' and ')+' light. What colour do you get?', text:'Mix '+names.join(' + ')+' light. What colour do you get?',
    visual:{kind:'mix',parts:parts}, options:opts, answer:res, merge:true,
    fact:sentence+' = '+RESULTS[res].n+'!', good:RESULTS[res].n+'!'};
}
function buildQuestions(){
  return [
    identify('qbrick'),
    identify('rj'),
    identify('led'),
    identify('wheel'),
    pickBrain(),
    identify('pillar'),
    identify('lblock'),
    identify('tblock'),
    pickBlock('lblock'),
    identify('deg45'),
    identify('conn'),
    {say:'What does R G B stand for?', text:'What does RGB stand for?', visual:{kind:'rgb'},
      options:shuffle([
        {id:'ok',kind:'text',label:'Red Green Blue'},
        {id:'b',kind:'text',label:'Run Go Bounce'},
        {id:'c',kind:'text',label:'Rain Gold Brown'},
        {id:'d',kind:'text',label:'Round Green Black'}]),
      answer:'ok', fact:'RGB means Red, Green and Blue. Lights of these 3 colours make lots of new colours!', good:'Red Green Blue!'},
    {say:'Which 3 colours are in RGB?', text:'Which 3 colours are in RGB?', visual:{kind:'img',key:'led'},
      options:shuffle([
        {id:'ok',kind:'dots',label:'Red, Green, Blue',cols:['#ff2a2a','#2fd45e','#3a4dff']},
        {id:'b',kind:'dots',label:'Red, Yellow, Blue',cols:['#ff2a2a','#ffe600','#3a4dff']},
        {id:'c',kind:'dots',label:'Pink, Green, Orange',cols:['#ff3fb0','#2fd45e','#ff8a1f']},
        {id:'d',kind:'dots',label:'Purple, Brown, Red',cols:['#8a3fff','#8a5a2b','#ff2a2a']}]),
      answer:'ok', fact:'The RGB LED has a Red, a Green and a Blue light inside.', good:'Red, Green and Blue!'},
    mix(['red','green'],'yellow'),
    mix(['red','blue'],'pink'),
    mix(['green','blue'],'sky'),
    mix(['red','green','blue'],'white')
  ];
}

  var arms = (mood==='cheer'||extra==='wave')
    ? '<path d="M20 108L6 82" stroke="#1c2660" stroke-width="7" stroke-linecap="round"/><path d="M100 108L114 82" stroke="#1c2660" stroke-width="7" stroke-linecap="round"/><circle cx="6" cy="80" r="7" fill="#ffc21a" stroke="#1c2660" stroke-width="3"/><circle cx="114" cy="80" r="7" fill="#ffc21a" stroke="#1c2660" stroke-width="3"/>'
    : '<path d="M22 112L10 126" stroke="#1c2660" stroke-width="7" stroke-linecap="round"/><path d="M98 112L110 126" stroke="#1c2660" stroke-width="7" stroke-linecap="round"/>';
  return '<svg class="robot'+(extra==='small'?' small':'')+'" viewBox="-6 0 132 150" role="img" aria-label="Qbo the robot" xmlns="http://www.w3.org/2000/svg">'+
    '<line x1="60" y1="22" x2="60" y2="8" stroke="#1c2660" stroke-width="5" stroke-linecap="round"/><circle class="ant" cx="60" cy="8" r="7" stroke="#1c2660" stroke-width="3" fill="#ff2d55"/>'+
    arms+
    '<rect x="28" y="100" width="64" height="40" rx="12" fill="#ffc21a" stroke="#1c2660" stroke-width="4"/><rect x="48" y="112" width="24" height="14" rx="4" fill="#2a2f55"/>'+
    '<rect x="16" y="22" width="88" height="76" rx="24" fill="#7b5cff" stroke="#1c2660" stroke-width="4"/>'+
    '<rect x="26" y="42" width="68" height="52" rx="18" fill="#1c2660"/>'+
    eyes+mouth+extras+
    '<circle cx="34" cy="80" r="5" fill="#ff5fa2" opacity=".8"/><circle cx="86" cy="80" r="5" fill="#ff5fa2" opacity=".8"/>'+
    '</svg>';
}

/* ---------- sound ---------- */
var AC=null,muted=false;
try{muted=localStorage.getItem('qq-muted')==='1'}catch(e){}
function ctx(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t,d,type,v){
  if(muted)return;var c=ctx();if(!c)return;
  try{var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;
  var s=c.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.18,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);
  o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.05)}catch(e){}
}
function sndCorrect(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.1,.3,'triangle')})}
function sndOops(){tone(330,0,.18,'square',.1);tone(262,.16,.3,'square',.1)}
function sndSad(){[392,349,311,262].forEach(function(f,i){tone(f,i*.22,.4,'triangle',.16)})}
function sndTap(){tone(660,0,.08,'sine',.12)}
function sndWin(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,i*.12,.3,'triangle')})}

/* ---------- confetti ---------- */
var cv=document.getElementById('confetti'),cx=cv.getContext('2d'),parts=[],raf=0;
var CONF=['#ff2d55','#ffc21a','#31d38a','#3a4dff','#ff5fa2','#7b5cff','#19d4ff'];
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){var d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function burst(n,x,y,spread,power){
  if(reduce)n=Math.round(n/4);
  for(var i=0;i<n;i++){
    var a=-Math.PI/2+(Math.random()-.5)*spread,sp=(power||14)*(.5+Math.random()*.8);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:6+Math.random()*8,h:4+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:CONF[i%CONF.length],round:Math.random()<.3,life:0});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){return p.y<innerHeight+30&&p.life<260});
  parts.forEach(function(p){
    p.life++;p.vy+=.35;p.vx*=.992;p.vy*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.round){cx.beginPath();cx.arc(0,0,p.w/2,0,7);cx.fill()}else{cx.fillRect(-p.w/2,-p.h/2,p.w,p.h)}
    cx.restore();
  });
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,innerWidth,innerHeight);
}
function bigConfetti(){
  var w=innerWidth,h=innerHeight;
  burst(90,w*.15,h*.85,1.3,19);burst(90,w*.85,h*.85,1.3,19);burst(70,w*.5,h*.6,2.2,17);
}

/* ---------- elements ---------- */
function $(id){return document.getElementById(id)}
var elStart=$('start'),elQuiz=$('quiz'),elEnd=$('end'),elOv=$('ov');
var elQ=$('qtext'),elStage=$('stage'),elOpts=$('opts'),elFb=$('fb'),elFbText=$('fbText'),elNext=$('nextBtn');
var Q=[],idx=0,tries=0,stars=0,locked=false,ovTimer=0;

/* floating decorative blocks */
(function(){
  var f=$('floaters'),cols=['#ffc21a','#ff5fa2','#31d38a','#7b5cff','#a3acc0'];
  for(var i=0;i<12;i++){
    var d=document.createElement('div');d.className='floater';
    d.style.left=(Math.random()*96)+'%';d.style.background=cols[i%cols.length];
    var s=26+Math.random()*34;d.style.width=d.style.height=s+'px';
    d.style.animationDuration=(22+Math.random()*26)+'s';d.style.animationDelay=(-Math.random()*40)+'s';
    f.appendChild(d);
  }
})();

/* ---------- mute ---------- */
var elMute=$('mute');
function drawMute(){
  elMute.innerHTML=muted
    ?'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
    :'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>';
  elMute.setAttribute('aria-pressed',muted?'true':'false');
}
elMute.addEventListener('click',function(){muted=!muted;try{localStorage.setItem('qq-muted',muted?'1':'0')}catch(e){}drawMute();if(!muted)sndTap();else if(window.speechSynthesis)speechSynthesis.cancel()});
drawMute();

/* ---------- speech ---------- */
var canSpeak=!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
if(!canSpeak)$('speak').hidden=true;
function say(t){
  if(!canSpeak||muted)return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}
}
$('speak').addEventListener('click',function(){var wasMuted=muted;muted=false;say(Q[idx].say);muted=wasMuted});

/* ---------- screens ---------- */
function show(which){
  elStart.hidden=which!=='start';elQuiz.hidden=which!=='quiz';elEnd.hidden=which!=='end';
  window.scrollTo(0,0);
}
function drawHearts(){
  var left=2-tries,h='';
  for(var i=0;i<2;i++)h+=HEART.replace('CLS',i<left?'heart-full':'heart-off');
  $('hearts').innerHTML=h;
  $('hearts').setAttribute('aria-label',left+' tries left');
}

function visualHTML(v){
  if(!v)return '';
  if(v.kind==='img')return '<img alt="'+NAMES[v.key]+' picture" src="'+IMG[v.key]+'">';
  if(v.kind==='svg')return blockSvg(v.key);
  if(v.kind==='rgb')return '<div class="rgbword" aria-label="R G B"><span style="color:#ff2a2a">R</span><span style="color:#2fd45e">G</span><span style="color:#3a4dff">B</span></div>';
  if(v.kind==='mix'){
    var h='<div class="mix" id="mixbox" role="img" aria-label="Lights of '+v.parts.map(function(p){return COLORS[p].n}).join(' and ')+'">';
    v.parts.forEach(function(p,i){h+='<div class="lamp" data-i="'+i+'" style="background:'+COLORS[p].lamp+';color:'+COLORS[p].lamp+'55"></div>'});
    h+='<div class="plus" id="plus1">+</div>'+(v.parts.length===3?'<div class="plus" id="plus2">+</div>':'');
    h+='<div class="hint">Which colour will the lights make?</div></div>';
    return h;
  }
  return '';
}
function placeLamps(n,merged){
  var box=$('mixbox');if(!box)return;
  var apart=n===2?[[-84,0],[84,0]]:[[-108,0],[0,0],[108,0]];
  var together=n===2?[[-26,0],[26,0]]:[[-26,20],[26,20],[0,-26]];
  var set=merged?together:apart;
  var lamps=box.querySelectorAll('.lamp');
  for(var i=0;i<lamps.length;i++)lamps[i].style.transform='translate('+set[i][0]+'px,'+set[i][1]+'px)';
  var p1=$('plus1'),p2=$('plus2');
  if(n===2){p1.style.marginLeft='0px'}else{p1.style.marginLeft='-54px';if(p2)p2.style.marginLeft='54px'}
  if(merged)box.classList.add('merged');
}
function optHTML(o){
  if(o.kind==='text')return o.label;
  if(o.kind==='svg')return blockSvg(o.key);
  if(o.kind==='img')return '<img alt="'+o.label+'" src="'+IMG[o.key]+'">';
  if(o.kind==='swatch')return '<span class="dot swatch" style="background:'+o.hex+'"></span><span>'+o.label+'</span>';
  if(o.kind==='dots')return '<span class="dots">'+o.cols.map(function(c){return '<span class="dot" style="background:'+c+'"></span>'}).join('')+'</span>';
  return '';
}

function loadQ(){
  var q=Q[idx];tries=0;locked=false;
  clearTimeout(ovTimer);
  $('count').textContent=(idx+1)+' / '+Q.length;
  $('fill').style.width=(idx/Q.length*100)+'%';
  $('track').setAttribute('aria-valuenow',idx);$('track').setAttribute('aria-valuemax',Q.length);
  drawHearts();
  elQ.textContent=q.text;
  elStage.innerHTML=visualHTML(q.visual);
  elStage.hidden=!q.visual;
  if(q.visual&&q.visual.kind==='mix')placeLamps(q.visual.parts.length,false);
  elOpts.innerHTML='';
  q.options.forEach(function(o){
    var b=document.createElement('button');
    b.type='button';b.className='opt'+((o.kind==='svg'||o.kind==='img')?' visual':'');
    b.setAttribute('data-id',o.id);b.setAttribute('aria-label',o.label);
    b.innerHTML=optHTML(o);
    b.addEventListener('click',function(){answer(o.id,b)});
    elOpts.appendChild(b);
  });
  elFb.hidden=true;
  elNext.textContent=idx===Q.length-1?'Finish!':'Next';
  setTimeout(function(){say(q.say)},350);
}

function correctBtn(){return elOpts.querySelector('[data-id="'+Q[idx].answer+'"]')}
function lockAll(){[].forEach.call(elOpts.children,function(b){b.disabled=true})}

function answer(id,btn){
  if(locked)return;
  var q=Q[idx];
  if(id===q.answer){
    locked=true;lockAll();
    btn.classList.add('right');
    var gained=tries===0?2:1;stars+=gained;
    sndCorrect();
    var r=btn.getBoundingClientRect();
    burst(70,r.left+r.width/2,r.top+r.height/2,2.6,15);
    setTimeout(function(){burst(60,innerWidth*.2,innerHeight*.9,1.2,19);burst(60,innerWidth*.8,innerHeight*.9,1.2,19)},180);
    if(q.merge)placeLamps(q.visual.parts.length,true);
    elFb.style.borderColor='var(--mint)';elFb.style.background='#effff6';
    elFbText.innerHTML='<b>Yay! '+q.good+'</b>'+q.fact+(tries===0?' You got 2 stars!':' You got 1 star!');
    elFb.hidden=false;
    elFb.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
    elNext.focus({preventScroll:true});
    say('Yay! '+q.good);
  }else{
    tries++;drawHearts();
    btn.classList.add('shake');btn.disabled=true;
    setTimeout(function(){btn.classList.remove('shake');btn.classList.add('gone')},500);
    if(tries===1){showOops()}else{locked=true;lockAll();showSad()}
  }
}

/* ---------- full screen reactions ---------- */
function closeOv(){elOv.hidden=true;elOv.innerHTML='';elOv.className='ov';clearTimeout(ovTimer)}
function showOops(){
  sndOops();
  elOv.className='ov oops';
  var qm='';for(var i=0;i<8;i++)qm+='<span class="qm" style="left:'+(Math.random()*90)+'%;top:'+(Math.random()*90)+'%;font-size:'+(40+Math.random()*70)+'px;animation-delay:'+(-Math.random()*3)+'s">?</span>';
  elOv.innerHTML=qm+robot('oops')+'<h2>Oops!</h2><p>Not that one. You can try one more time!</p>';
  elOv.hidden=false;
  elOv.onclick=function(){closeOv();say(Q[idx].say)};
  ovTimer=setTimeout(function(){closeOv();say(Q[idx].say)},2400);
}
function showSad(){
  sndSad();
  var q=Q[idx];
  elOv.className='ov sad';
  var rain='';for(var i=0;i<46;i++)rain+='<span class="drop" style="left:'+(Math.random()*100)+'%;animation-duration:'+(.8+Math.random()*.9)+'s;animation-delay:'+(-Math.random()*2)+'s"></span>';
  var ans=q.merge?q.fact:(NAMES[q.answer]||q.good.replace(/!$/,''));
  if(q.answer==='ok')ans=q.good.replace(/!$/,'');
  elOv.innerHTML=rain+robot('sad')+'<h2>Good try!</h2><p>The answer is</p><div class="ans">'+ans+'</div><button class="go" id="ovNext" type="button">'+(idx===Q.length-1?'Finish':'Next question')+'</button>';
  elOv.hidden=false;elOv.onclick=null;
  $('ovNext').addEventListener('click',function(e){e.stopPropagation();closeOv();sndTap();next()});
  $('ovNext').focus();
  var cb=correctBtn();if(cb)cb.classList.add('reveal');
  if(q.merge)placeLamps(q.visual.parts.length,true);
  say('Good try! The answer is '+ans);
}

/* ---------- flow ---------- */
function next(){
  if(idx<Q.length-1){idx++;loadQ()}else{finish()}
}
elNext.addEventListener('click',function(){sndTap();next()});

function finish(){
  $('fill').style.width='100%';
  var max=Q.length*2,pct=stars/max;
  var lit=pct>=.8?3:pct>=.5?2:1;
  show('end');
  $('endRobot').innerHTML=robot(pct>=.5?'cheer':'happy');
  $('endTitle').textContent=pct>=.8?'Super star!':pct>=.5?'Great job!':'Nice try!';
  var s='';for(var i=0;i<3;i++)s+=STAR.replace('CLS',i<lit?'star-on':'star-off').replace('<svg','<svg style="animation-delay:'+(i*.35)+'s"');
  $('endStars').innerHTML=s;
  $('endScore').textContent='You won '+stars+' stars out of '+max+'!';
  $('endMsg').textContent=pct>=.8?'You know all about Qbits and colour lights!':pct>=.5?'You know lots of robot parts. Play again for more stars!':'Every try helps you learn. Play again and win more stars!';
  sndWin();bigConfetti();setTimeout(bigConfetti,900);
  say($('endTitle').textContent+' '+$('endScore').textContent);
}

function begin(){
  ctx();sndTap();
  Q=buildQuestions();idx=0;stars=0;
  show('quiz');loadQ();
}
$('startBtn').addEventListener('click',begin);
$('againBtn').addEventListener('click',begin);
$('startRobot').innerHTML=robot('happy','wave');
$('startRobot').querySelector('svg').classList.add('wave');
show('start');
})();
</script>
